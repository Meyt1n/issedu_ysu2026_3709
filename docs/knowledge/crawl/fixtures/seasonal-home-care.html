  <h1>换季与流感季居家照护教学摘录</h1>
  <p>本页为 HomeCare Twin 本地夹具，用于验证受控知识爬虫。内容为合成教学文，不构成诊断或用药建议。</p>
  <h2>居家照护要点</h2>
  <ul>
    <li>换季时保持室内定时通风，注意早晚温差与保暖。</li>
    <li>家庭成员出现不适时记录起始时间、体温与休息情况，便于向专业人员描述。</li>
    <li>老人与儿童的观察频率可以适当提高，由家庭照护者交接记录。</li>
    <li>常用体温计、口罩等物品放在家庭成员知晓的固定位置。</li>
  </ul>
  <h2>何时寻求专业帮助</h2>
  <p>症状持续加重、高热不退或出现呼吸困难时，应联系医务人员或当地急救服务；本页不提供判断标准。</p>
  <h2>禁止</h2>
  <p>不得根据本页给出诊断、剂量、停药或换药结论。</p>
