<body>
  <h1>过期药品清理与回收教学摘录</h1>
  <p>本页为 HomeCare Twin 本地夹具，用于验证受控知识爬虫。内容为合成教学文，不构成诊断或用药建议。</p>
  <h2>清理要点</h2>
  <ul>
    <li>定期盘点家庭药箱，把过期、变色、异味或包装破损的药品单独移出。</li>
    <li>移出的药品避免与在用药混放，防止误取误服。</li>
    <li>优先通过社区或药店的药品回收渠道处置，不随意丢入生活垃圾。</li>
    <li>清理后更新家庭药品清单，让照护者知道哪些药已不在库。</li>
  </ul>
  <h2>禁止</h2>
  <p>不得根据本页判断药品是否仍可服用；是否续用请咨询专业人员。</p>
</body>
</html>
