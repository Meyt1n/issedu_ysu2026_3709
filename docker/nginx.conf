# HCT-453：同一份构建产物、两个登录入口（一个 API、一套授权真相）。
# 80 端口 = 家庭成员前台（Compose 默认映射宿主 8080）；
# 81 端口 = 家庭管理后台（Compose 默认映射宿主 8081，ADMIN_WEB_PORT 可改）。
# 通过 sub_filter 在 index.html 的 <head> 注入 window.__HCT_PORTAL_MODE__，
# 前端 src/web/src/ui/portalEntry.ts 据此锁定入口品牌与门户匹配；
# 该注入只是 UX 锁，任何权限判断仍由 API 按 HCT-439 事实完成。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    sub_filter '<head>' '<head><script>window.__HCT_PORTAL_MODE__="member"</script>';
    sub_filter_once on;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html;

    sub_filter '<head>' '<head><script>window.__HCT_PORTAL_MODE__="admin"</script>';
    sub_filter_once on;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
