<body>
  <h1>提醒升级与静默窗口教学摘录</h1>
  <p>本页为 HomeCare Twin 本地夹具，用于验证受控知识爬虫。内容为合成教学文，不构成诊断或用药建议。</p>
  <h2>升级阶梯</h2>
  <ul>
    <li>首次提醒：仅通知被照护人或指定执行人。</li>
    <li>错过确认后：按家庭规则升级到下一位授权联系人。</li>
    <li>紧急规则命中时：走紧急联络卡，不依赖普通提醒通道。</li>
  </ul>
  <h2>静默窗口</h2>
  <p>夜间或用户设定的静默时段应减少打扰；到期未确认仍按规则补发，不得静默掉紧急升级。</p>
  <h2>禁止</h2>
  <p>不得根据本页调整医嘱剂量或停止用药。</p>
</body>
</html>
