[project]
name = "homecare-twin-api"
version = "0.1.0"
description = "HomeCare Twin local-first family care API foundation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.14,<2",
  "bcrypt>=4.2,<5",
  "cryptography>=43,<46",
  "fastapi>=0.115,<0.116",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic-settings>=2.7,<3",
  "psutil>=6.1,<8",
  "pymysql>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.34,<0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "requests>=2.32,<3",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src/api", "src", "scripts"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src/api", "src/ai", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
