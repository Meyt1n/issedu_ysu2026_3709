services:
  db:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    profiles: ["basic", "enhanced", "dev"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-homecare}
      MYSQL_USER: ${MYSQL_USER:-homecare}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+00:00"
      - "--log-bin-trust-function-creators=1"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    profiles: ["basic", "enhanced", "dev"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      ALLOW_DEV_ACTOR_HEADER: ${ALLOW_DEV_ACTOR_HEADER:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DEFAULT_HOUSEHOLD_TIME_ZONE: ${DEFAULT_HOUSEHOLD_TIME_ZONE:-UTC}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-homecare}:${MYSQL_PASSWORD:-change-me}@db:3306/${MYSQL_DATABASE:-homecare}?charset=utf8mb4
      PYTHONPATH: /app/src/api:/app/src
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-unavailable}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      # HCT-201 教学演示主数据（INTERNAL_TEACHING_DEMO）。默认空 = fail-closed。
      # 先在宿主机运行 `uv run python scripts/setup_vision_demo.py` 生成快照，
      # 再在 .env 设 MASTER_DATA_APPROVED_VERSIONS=demo-cn-en-v1 开启教学路径。
      # 正式 HCT-201 药品集仍 UNRELEASED，不得经此变量指向未批准版本。
      MASTER_DATA_ROOT: /app/data/master-data
      MASTER_DATA_APPROVED_VERSIONS: ${MASTER_DATA_APPROVED_VERSIONS:-}
    volumes:
      - ./data/master-data:/app/data/master-data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" "]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  outbox-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    profiles: ["basic", "enhanced", "dev"]
    command: ["uv", "run", "--no-sync", "python", "-m", "app.outbox_worker", "--loop"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-homecare}:${MYSQL_PASSWORD:-change-me}@db:3306/${MYSQL_DATABASE:-homecare}?charset=utf8mb4
      PYTHONPATH: /app/src/api:/app/src
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-2}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_STALE_SECONDS: ${OUTBOX_STALE_SECONDS:-300}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/homecare-outbox-worker.ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  care-plan-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    profiles: ["basic", "enhanced", "dev"]
    command:
      [
        "uv", "run", "--no-sync", "python", "-m", "app.care_plan_worker",
        "--loop", "--ready-file", "/tmp/homecare-care-plan-worker.ready",
      ]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-homecare}:${MYSQL_PASSWORD:-change-me}@db:3306/${MYSQL_DATABASE:-homecare}?charset=utf8mb4
      PYTHONPATH: /app/src/api:/app/src
      CARE_PLAN_POLL_SECONDS: ${CARE_PLAN_POLL_SECONDS:-30}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/homecare-care-plan-worker.ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    profiles: ["basic", "enhanced", "dev"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  ollama:
    image: ollama/ollama:0.5.7@sha256:1e7db6ec3588e66d8ed56be25ecfa1aef5d1e44be6f86c7dfc09eb59f33d0bd8
    restart: unless-stopped
    profiles: ["enhanced", "dev"]
    environment:
      OLLAMA_KEEP_ALIVE: 300s
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_HOST: 0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
  ollama_models:
