name: Relay Review Bot

# Automatic Relay Review Bot execution is intentionally disabled by project-owner
# decision on 2026-08-18. Keep a manual trigger for rollback/diagnostics only.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  relay-review:
    name: Relay Review Bot
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Determine whether a bound Issue requires Relay Review
        id: eligibility
        env:
          PR_EVENT_PATH: ${{ github.event_path }}
          PYTHONUTF8: "1"
        run: python .github/scripts/relay_review_eligibility.py

      - name: Run relay review
        if: steps.eligibility.outputs.review_required == 'true'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          REVIEW_API_WIRE: ${{ vars.REVIEW_API_WIRE }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_MAX_DIFF_CHARS: ${{ vars.REVIEW_MAX_DIFF_CHARS }}
          REVIEW_API_TIMEOUT_SECONDS: ${{ vars.REVIEW_API_TIMEOUT_SECONDS }}
        run: python .github/scripts/relay_review_bot.py

      - name: Skip relay review for PRs without an Issue binding
        if: steps.eligibility.outputs.review_required != 'true'
        run: |
          echo "::notice::No Closes/Fixes/Resolves reference in the dedicated Issue field; Relay Review Bot skipped."
          echo "CI, secret scan, and other required checks remain unchanged."
