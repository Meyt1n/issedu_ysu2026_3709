name: 双仓库历史归属修复 Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dry-run:
    name: 审计历史提交并生成按身份同步计划
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUD_REPO_URL: http://119.3.217.118:30181/29092881243490627/issedu_ysu2026_3709.git
      GH_TOKEN: ${{ github.token }}
      CLOUD_REPO_USERNAME: ${{ secrets.CLOUD_REPO_USERNAME }}
      CLOUD_REPO_PASSWORD: ${{ secrets.CLOUD_REPO_PASSWORD }}
      CLOUD_TOKEN_SHEN_HUANG_123: ${{ secrets.CLOUD_TOKEN_SHEN_HUANG_123 }}
      CLOUD_TOKEN_RY12_20: ${{ secrets.CLOUD_TOKEN_RY12_20 }}
      CLOUD_TOKEN_389883656_LGTM: ${{ secrets.CLOUD_TOKEN_389883656_LGTM }}
      CLOUD_TOKEN_JIN_123_ZIP: ${{ secrets.CLOUD_TOKEN_JIN_123_ZIP }}

    steps:
      - name: 检出 GitHub master 完整历史
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: 校验读取凭据并获取内部 master
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUD_REPO_USERNAME}" || -z "${CLOUD_REPO_PASSWORD}" ]]; then
            echo "::error::缺少只读内部仓库凭据，不能生成历史 dry-run"
            exit 1
          fi
          askpass="${RUNNER_TEMP}/cloud-history-askpass.sh"
          trap 'rm -f "${askpass}"' EXIT
          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "${CLOUD_SELECTED_USERNAME}" ;;
            *Password*) printf '%s\n' "${CLOUD_SELECTED_PASSWORD}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0
          export CLOUD_SELECTED_USERNAME="${CLOUD_REPO_USERNAME}"
          export CLOUD_SELECTED_PASSWORD="${CLOUD_REPO_PASSWORD}"
          git remote add original-cloud "${CLOUD_REPO_URL}"
          git fetch original-cloud master
          cloud_sha="$(git rev-parse original-cloud/master)"
          github_sha="$(git rev-parse master)"
          echo "cloud_sha=${cloud_sha}" >> "${GITHUB_ENV}"
          echo "github_sha=${github_sha}" >> "${GITHUB_ENV}"

      - name: 生成不推送的历史归属计划
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/cloud_sync_history_repair.py \
            --repo . \
            --github-repository "${GITHUB_REPOSITORY}" \
            --cloud-sha "${cloud_sha}" \
            --github-sha "${github_sha}" \
            --output "${RUNNER_TEMP}/cloud-history-plan.json"
          jq -r '"模式=" + .mode, "内部起点=" + .cloud_sha, "GitHub目标=" + .github_sha, "第一父节点数=" + (.first_parent_count|tostring), "按提交身份动作数=" + (.action_count|tostring), "", (.actions[] | [.kind, .sha[0:12], .github_login, (.pr_number // "-")] | @tsv)' "${RUNNER_TEMP}/cloud-history-plan.json"

      - name: 明确禁止推送
        shell: bash
        run: |
          echo "::notice::本工作流仅完成历史身份审计和 dry-run 计划，不向内部仓库 push。"
