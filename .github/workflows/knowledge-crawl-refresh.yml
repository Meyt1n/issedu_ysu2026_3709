name: Knowledge crawl refresh

# 定时刷新白名单夹具/已启用源到 staging；绝不自动入库正式索引。
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: "Fetch enabled remote HTTPS sources (default false)"
        required: false
        default: "false"

jobs:
  crawl-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --frozen
      - name: Crawl allowlisted fixtures (and optional live sources)
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            uv run python scripts/crawl_knowledge_sources.py --live --due-only
          else
            uv run python scripts/crawl_knowledge_sources.py --due-only
            uv run python scripts/crawl_knowledge_sources.py
          fi
      - name: Unit test crawl pipeline
        run: uv run pytest tests/unit/test_knowledge_crawl.py -q
      - name: Upload staging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-staging
          path: docs/knowledge/staging/
          if-no-files-found: warn
      - name: Print ops status
        run: uv run python scripts/crawl_knowledge_sources.py --status
