name: PR task and risk governance

on:
  # 只读取 PR 元数据并执行默认分支上的可信脚本；不 checkout 或执行 PR 分支代码。
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  task-metadata:
    name: Task association and risk metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate PR metadata
        env:
          PR_EVENT_PATH: ${{ github.event_path }}
          PYTHONUTF8: "1"
        run: python .github/scripts/validate_pr_metadata.py
