name: Knowledge approved dry-run

# Automatic PR-triggered runs are disabled to follow the project-owner decision
# on 2026-08-18 (see AGENTS.md and ci.yml): retained workflows are manual-only
# and must not act as merge gates. Run this dry-run manually via
# workflow_dispatch before merging knowledge/ingest changes when needed.
on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync Python deps
        run: uv sync --frozen
      - name: Prepare SQLite and migrate
        run: |
          export DATABASE_URL="sqlite+pysqlite:///./approved-dry-run.sqlite3"
          uv run alembic upgrade head
      - name: Dry-run example approved manifest
        env:
          DATABASE_URL: sqlite+pysqlite:///./approved-dry-run.sqlite3
        run: |
          uv run python scripts/ingest_local_knowledge.py \
            --manifest docs/knowledge/approved/正式知识清单.example.json \
            --source-root docs/knowledge/approved \
            --actor-id knowledge-steward \
            --index-version approved-inserts-example-v1 \
            --dry-run
