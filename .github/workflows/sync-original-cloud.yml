name: 同步 master 到原云端仓库

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-original-cloud-master
  cancel-in-progress: false

jobs:
  sync:
    name: 按登记成员身份快进同步到原云端
    # This job handles repository secrets and writes to the internal mirror.
    # Keep it off hosted/fork runners and require the dedicated runner label.
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, hct-sync]
    timeout-minutes: 10
    env:
      CLOUD_REPO_URL: http://119.3.217.118:30181/29092881243490627/issedu_ysu2026_3709.git

    steps:
      - name: 检出完整 Git 历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 预检身份并按成员 Token 逐个同步
        shell: bash
        env:
          CLOUD_REPO_USERNAME: ${{ secrets.CLOUD_REPO_USERNAME }}
          CLOUD_REPO_PASSWORD: ${{ secrets.CLOUD_REPO_PASSWORD }}
          CLOUD_TOKEN_SHEN_HUANG_123: ${{ secrets.CLOUD_TOKEN_SHEN_HUANG_123 }}
          CLOUD_TOKEN_RY12_20: ${{ secrets.CLOUD_TOKEN_RY12_20 }}
          CLOUD_TOKEN_389883656_LGTM: ${{ secrets.CLOUD_TOKEN_389883656_LGTM }}
          CLOUD_TOKEN_JIN_123_ZIP: ${{ secrets.CLOUD_TOKEN_JIN_123_ZIP }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUD_REPO_USERNAME}" || -z "${CLOUD_REPO_PASSWORD}" ]]; then
            echo "::error::缺少 CLOUD_REPO_USERNAME 或 CLOUD_REPO_PASSWORD；无法读取内部 master"
            exit 1
          fi

          askpass="${RUNNER_TEMP}/cloud-git-askpass.sh"
          cleanup() {
            rm -f "${askpass}"
          }
          trap cleanup EXIT

          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "${CLOUD_SELECTED_USERNAME}" ;;
            *Password*) printf '%s\n' "${CLOUD_SELECTED_PASSWORD}" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "${askpass}"

          export GIT_ASKPASS="${askpass}"
          export GIT_TERMINAL_PROMPT=0
          export CLOUD_SELECTED_USERNAME="${CLOUD_REPO_USERNAME}"
          export CLOUD_SELECTED_PASSWORD="${CLOUD_REPO_PASSWORD}"

          git remote add original-cloud "${CLOUD_REPO_URL}"
          git fetch original-cloud master

          github_sha="$(git rev-parse "${GITHUB_SHA}")"
          cloud_sha="$(git rev-parse original-cloud/master)"

          if [[ "${cloud_sha}" == "${github_sha}" ]]; then
            echo "原云端 master 已与本次 GitHub SHA 一致：${github_sha}"
            exit 0
          fi

          if git merge-base --is-ancestor "${github_sha}" "${cloud_sha}"; then
            echo "::notice::本次 GitHub SHA 已包含在更晚的内部 master 中，无需重复同步"
            exit 0
          fi

          if ! git merge-base --is-ancestor "${cloud_sha}" "${github_sha}"; then
            echo "::error::原云端 master 与本次 GitHub SHA 已分叉，拒绝强制覆盖"
            exit 1
          fi

          sync_plan_json="$(python3 .github/scripts/cloud_sync_plan.py plan \
            --repo . \
            --cloud-sha "${cloud_sha}" \
            --github-sha "${github_sha}")"
          sync_mode="$(jq -r '.mode' <<< "${sync_plan_json}")"
          mapfile -t sync_shas < <(jq -r '.shas[]' <<< "${sync_plan_json}")
          if [[ "${#sync_shas[@]}" -eq 0 ]]; then
            echo "::error::没有找到可快进同步的 GitHub master 提交"
            exit 1
          fi
          echo "同步路径预检通过：${sync_mode}，共 ${#sync_shas[@]} 个快进节点"

          declare -a sync_plan=()
          plan_previous_sha="${cloud_sha}"
          for sync_sha in "${sync_shas[@]}"; do
            pr_meta="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${sync_sha}/pulls" \
              --header 'Accept: application/vnd.github+json' \
              --jq 'map(select(.base.ref == "master" and .merged_at != null)) | if length == 1 then .[0] | [.number, .user.login] | @tsv else "" end')"
            parent_line="$(git rev-list --parents -n 1 "${sync_sha}")"
            read -ra parent_fields <<< "${parent_line}"
            parent_count=$((${#parent_fields[@]} - 1))

            kind=""
            reference=""
            pr_number=""
            pr_login=""
            commit_count=""
            introduced_count=""
            if [[ "${parent_count}" -eq 1 && -z "${pr_meta}" ]]; then
              if [[ "$(git rev-parse "${sync_sha}^")" != "${plan_previous_sha}" ]]; then
                echo "::error::直接维护提交 ${sync_sha} 的父提交不是当前同步点；拒绝跳过历史"
                exit 1
              fi
              direct_commit_file="${RUNNER_TEMP}/sync-cloud-direct-${sync_sha}.json"
              gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${sync_sha}" \
                --header 'Accept: application/vnd.github+json' > "${direct_commit_file}"
              direct_parent_sha="$(git rev-parse "${sync_sha}^")"
              identity_error_file="${RUNNER_TEMP}/sync-cloud-direct-${sync_sha}-identity-error.txt"
              if ! identity_json="$(python3 .github/scripts/cloud_sync_identity.py \
                --direct-commit-file "${direct_commit_file}" \
                --repo . \
                --commit-sha "${sync_sha}" \
                --parent-sha "${direct_parent_sha}" \
                2>"${identity_error_file}")"; then
                identity_error="$(tr '\n' ' ' < "${identity_error_file}")"
                identity_error="${identity_error#::error::}"
                echo "::error::直接维护提交 ${sync_sha} 身份预检失败：${identity_error}"
                echo "::error::此次未向内部云端 push。直接 master 提交只允许已登记成员、author=committer、单父拓扑，且完整 Git diff 中所有变更均为 doc/docs 的 added/modified 文档。"
                exit 1
              fi
              kind="direct-maintenance"
              reference="direct"
              commit_count="$(jq -r '.commit_count' <<< "${identity_json}")"
              introduced_count="1"
            elif [[ "${parent_count}" -eq 1 || "${parent_count}" -eq 2 ]]; then
              if [[ -z "${pr_meta}" ]]; then
                echo "::error::提交 ${sync_sha} 的拓扑需要唯一已合并 master PR，但 GitHub API 未返回唯一关联；禁止使用其他成员 Token"
                exit 1
              fi

              IFS=$'\t' read -r pr_number pr_login <<< "${pr_meta}"
              commits_file="${RUNNER_TEMP}/sync-cloud-pr-${pr_number}-commits.ndjson"
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/commits?per_page=100" \
                --header 'Accept: application/vnd.github+json' \
                --jq '.[]' > "${commits_file}"

              boundary_json="$(python3 .github/scripts/cloud_sync_plan.py validate-boundary \
                --repo . \
                --previous-sha "${plan_previous_sha}" \
                --target-sha "${sync_sha}" \
                --pr-commits-file "${commits_file}")"
              introduced_count="$(jq -r '.introduced_count' <<< "${boundary_json}")"

              identity_error_file="${RUNNER_TEMP}/sync-cloud-pr-${pr_number}-identity-error.txt"
              if ! identity_json="$(python3 .github/scripts/cloud_sync_identity.py \
                --pr-login "${pr_login}" \
                --commits-file "${commits_file}" 2>"${identity_error_file}")"; then
                identity_error="$(tr '\n' ' ' < "${identity_error_file}")"
                identity_error="${identity_error#::error::}"
                echo "::error::PR #${pr_number}（作者 ${pr_login}）身份预检失败：${identity_error}"
                echo "::error::此次未向内部云端 push。请在合并前拆分 PR、改用正确的 PR 作者账号，或更正提交身份。"
                exit 1
              fi
              kind="pr-merge"
              reference="${pr_number}"
              commit_count="$(jq -r '.commit_count' <<< "${identity_json}")"
            else
              echo "::error::提交 ${sync_sha} 的父提交数量为 ${parent_count}；仅支持普通单父提交或双父 PR merge 提交"
              exit 1
            fi

            token_env="$(jq -r '.token_env' <<< "${identity_json}")"
            cloud_username="$(jq -r '.cloud_username' <<< "${identity_json}")"
            username_env="$(jq -r '.cloud_username_env' <<< "${identity_json}")"
            if [[ -z "${pr_login}" ]]; then
              pr_login="$(jq -r '.github_login' <<< "${identity_json}")"
            fi

            if [[ ! "${token_env}" =~ ^CLOUD_[A-Z0-9_]+$ ]]; then
              echo "::error::${kind} ${reference} 返回了非法 Token 环境变量名"
              exit 1
            fi
            if [[ -z "$(printenv "${token_env}" || true)" ]]; then
              echo "::error::${kind} ${reference} 作者 ${pr_login} 缺少 ${token_env} Repository Secret"
              exit 1
            fi
            if [[ -n "${username_env}" && -z "$(printenv "${username_env}" || true)" ]]; then
              echo "::error::${kind} ${reference} 作者 ${pr_login} 缺少 ${username_env}"
              exit 1
            fi
            if [[ -z "${username_env}" && -z "${cloud_username}" ]]; then
              echo "::error::${kind} ${reference} 作者 ${pr_login} 缺少内部云端用户名映射"
              exit 1
            fi

            sync_plan+=(
              "${sync_sha}|${kind}|${reference}|${pr_login}|${token_env}|${cloud_username}|${username_env}|${commit_count}|${introduced_count}"
            )
            echo "预检通过：${kind} ${reference}，GitHub 作者 ${pr_login}，提交 ${commit_count} 个，本次新增可达提交 ${introduced_count} 个，Token ${token_env}"
            plan_previous_sha="${sync_sha}"
          done

          for plan_row in "${sync_plan[@]}"; do
            IFS='|' read -r \
              sync_sha kind reference pr_login token_env cloud_username username_env commit_count introduced_count \
              <<< "${plan_row}"

            export CLOUD_SELECTED_PASSWORD="$(printenv "${token_env}")"
            if [[ -n "${username_env}" ]]; then
              export CLOUD_SELECTED_USERNAME="$(printenv "${username_env}")"
            else
              export CLOUD_SELECTED_USERNAME="${cloud_username}"
            fi

            echo "同步 ${kind} ${reference}：${pr_login}，新增可达提交 ${introduced_count} 个，目标 ${sync_sha}"
            git push original-cloud "${sync_sha}:refs/heads/master"

            verified_cloud_sha="$(git ls-remote original-cloud refs/heads/master | awk '{print $1}')"
            if [[ "${verified_cloud_sha}" != "${sync_sha}" ]]; then
              echo "::error::${kind} ${reference} 推送后校验失败：原云端=${verified_cloud_sha}，预期=${sync_sha}"
              exit 1
            fi
          done

          echo "同步完成：原云端 master 与本次 GitHub SHA 一致：${github_sha}"
