name: HomeCare Twin CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "codex/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Mandatory development docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify agent and team entry points
        shell: bash
        run: |
          test -s AGENTS.md
          test -s "docs/vibe-coding/开发前必读与Vibe Coding工作流.md"
          grep -Fq "开发前必读与 Vibe Coding 工作流" README.md
          grep -Fq "开发前必读与 Vibe Coding 工作流" CONTRIBUTING.md
          grep -Fq "开发前必读与 Vibe Coding 工作流" "docs/vibe-coding/00-文档导航.md"

  backend:
    name: Backend lint, migration and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.5"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Lint Python
        run: uv run ruff check src/api src/ai scripts tests migrations

      - name: Upgrade a clean SQLite database
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.sqlite3
        run: uv run alembic upgrade head

      - name: Run backend tests
        run: uv run pytest --cov=src/api/app --cov-report=term-missing

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run check:web

      - name: Build frontend
        run: npm run build:web

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action otherwise derives the base from the first PR commit.
          # Explicitly use the GitHub event base SHA for merge-history-safe scans.
          BASE_REF: ${{ github.event.pull_request.base.sha }}
